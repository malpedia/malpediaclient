[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/malpedia/malpediaclient/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope and commit.scope != "security" %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { message = "^\\w+\\(security\\)", group = "<!-- 5 -->Security" },
    { message = "^\\w+(\\(.+\\))?!?: [Rr]emove", group = "<!-- 3 -->Removed" },
    { message = "^\\w+(\\(.+\\))?!?: [Dd]eprecate", group = "<!-- 2 -->Deprecated" },
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^(perf|refactor)", group = "<!-- 1 -->Changed" },
    { message = "^fix", group = "<!-- 4 -->Fixed" },
    { message = ".*", skip = true },
]
sort_commits = "oldest"
